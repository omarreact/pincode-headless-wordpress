name: Headless WP Cloudflare isolated-stage HTTP checks
on:
  push:
    branches:
      - chore/cloudflare-vinext-compat-20261030
    paths:
      - scripts/cloudflare-workers-stage-smoke.mjs
      - .github/workflows/cloudflare-stage-http.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-http:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only staging HTTP checks
        run: node scripts/cloudflare-workers-stage-smoke.mjs
