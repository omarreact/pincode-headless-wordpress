name: Next.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Production Next.js build
        env:
          NEXT_PUBLIC_SITE_URL: https://pincode-headless-wordpress.invalid
        run: npm run build
      - name: Validate WordPress PHP syntax
        run: |
          php -l wordpress/mu-plugins/headless-vercel-bridge.php
          php -l wordpress/wp-config.example.php
