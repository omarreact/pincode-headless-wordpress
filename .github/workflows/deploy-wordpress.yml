name: Deploy WordPress companion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    environment: production-wordpress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_PORT: ${{ secrets.WORDPRESS_SSH_PORT }}
          SSH_KNOWN_HOST: ${{ secrets.WORDPRESS_SSH_KNOWN_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.WORDPRESS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_KNOWN_HOST"
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Install must-use plugin
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_PORT: ${{ secrets.WORDPRESS_SSH_PORT }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          WORDPRESS_PATH: ${{ secrets.WORDPRESS_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"
          test -n "$WORDPRESS_PATH"
          test -f wordpress/mu-plugins/headless-vercel-bridge.php
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "mkdir -p '$WORDPRESS_PATH/wp-content/mu-plugins'"
          scp -P "$SSH_PORT" -i ~/.ssh/id_ed25519 wordpress/mu-plugins/pincode-control-api.php "$SSH_USER@$SSH_HOST:$WORDPRESS_PATH/wp-content/mu-plugins/pincode-control-api.php"
          scp -P "$SSH_PORT" -i ~/.ssh/id_ed25519 wordpress/mu-plugins/headless-vercel-bridge.php "$SSH_USER@$SSH_HOST:$WORDPRESS_PATH/wp-content/mu-plugins/headless-vercel-bridge.php"
